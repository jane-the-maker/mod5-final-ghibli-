<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m5-final Ghibli films</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <section id="landing">
    <div class="row nav__row">
      <div class="container nav__container">
        <img src="assets/ghibli-banner.webp" alt="" class="nav__banner">
        <div class="nav__content">
          <img src="assets/Studio-Ghibli-Logo-Secondary.webp" alt="" class="nav__logo">
          <ul class="nav__links">
            <li class="nav__link">
              <a href="#" class="nav__link">Home</a>
            </li>
            <li class="nav__link">
              <a href="#" class="nav__link">Contact</a>
            </li>
            <li class="nav__link">
              <a href="#" class="nav__link nav__link--primary">Films</a>
            </li>
          </ul>
        </div>
        <div class="search__wrapper">
          <h1 class="search__title">Check out our films!</h1>
          <div class="film__search--container">
            <input id="search-form" type="text" class="film__search--bar" placeholder="  What are you looking for?" onchange="onSearchChange(event)">
          </div>
        </div>
      </div> 
    </div>
  </section>
  
  <section id="films">
      <div class="row films__row">
        <div class="container films__container">
          <div class="films__header">         
            <select id="filter" class="sort-filter" onchange="sortFilms()">

              <option value="" disabled selected>Sort Films</option>
              <option value="DATE_ASCENDING">Oldest to Newest</option>
              <option value="DATE_DESCENDING">Newest to Oldest</option>
              <option value="RATING_ASCENDING">Worst to Best</option>
              <option value="RATING_DESCENDING">Best to Worst</option>
            </select>
          </div>
          <div class="films__list">
            <div class="film">
              <div class="film__card">
                  <figure class="film__img--wrapper">
                    <img class="film__img" src="" alt="">
                  </figure>  
                  <div class="film__card--bg"></div>
                  <div class="film__info">
                    <p>Director:<br></p>
                    <p>Released:<br></p>
                    <p>Runtime:<br></p>
                    <p>Rotten Tomatoes:</p><br>
                    <!-- <p>Synopsis: ${film.description}</p> -->
                  </div>
              </div>
            </div>
          </div>
        </div>  
      </div>
  </section>
  
</body>
<script src="films.js"></script>
</html>
